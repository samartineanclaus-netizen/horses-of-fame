name: V7 Sale Tests

on:
  push:
    branches:
      - v7-mint-escrow
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Compile
        run: npx hardhat compile
      - name: Run full V7 test suite
        run: npm test
