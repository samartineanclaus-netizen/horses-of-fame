name: Test HOF Voting

on:
  workflow_dispatch:
  push:
    paths:
      - "contracts/HOFVoting.sol"
      - "contracts/GenesisHorses.sol"
      - "test/HOFVoting.test.js"
      - ".github/workflows/test-hof-voting.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run HOF voting tests
        run: npx hardhat test test/HOFVoting.test.js
