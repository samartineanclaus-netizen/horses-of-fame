name: Test Genesis Reveal

on:
  workflow_dispatch:

jobs:
  test-reveal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Compile contract
        run: npx hardhat compile

      - name: Reveal and verify metadata URI
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: npx hardhat run deploy/test-reveal.js --network robinhoodTestnet
